<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Objectif 100 kg – Suivi Basic-Fit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#e8ebef;--card:#fff;--ink:#14213d;--mut:#5b667a;--line:#d3d9e2;--acc:#ff6a13;--accink:#fff;--ok:#1f9d63;--field:#f3f5f8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2230;--ink:#eef1f6;--mut:#9aa6ba;--line:#2a3447;--field:#222c3d;--ok:#3ec283;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2230;--ink:#eef1f6;--mut:#9aa6ba;--line:#2a3447;--field:#222c3d;--ok:#3ec283;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.2px}
h1{font-size:34px;line-height:1}
h2{font-size:26px;margin:20px 0 10px}
h3{font-size:21px}
.sub{color:var(--mut);margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font:700 64px/0.9 "Barlow Condensed",sans-serif}
.big small{font-size:22px;color:var(--mut);margin-left:4px}
.bar{height:12px;border-radius:6px;background:var(--field);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.row{display:flex;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:var(--field);border-radius:10px;padding:8px 10px}
.stats b{display:block;font:700 24px/1.1 "Barlow Condensed",sans-serif}
.stats span{font-size:13px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{flex:1 1 28%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 6px;font:600 15px Barlow,sans-serif;text-align:center}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{display:block;font-weight:500;opacity:.75;font-size:12px}
.exo p{margin:2px 0 10px;color:var(--mut);font-size:14px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.set span{color:var(--mut);font-weight:600}
input{width:100%;min-width:0;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:10px;font:600 16px Barlow,sans-serif}
input:disabled{opacity:.35}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.tab:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chk{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--mut);font-size:20px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cols{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;font-size:12px;color:var(--mut)}
.btn{width:100%;border:0;border-radius:12px;padding:14px;background:var(--acc);color:var(--accink);font:700 20px "Barlow Condensed",sans-serif;letter-spacing:.4px}
.btn.alt{background:var(--ink);color:var(--bg)}
.ghost{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 10px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{flex:1;border:0;background:none;color:var(--mut);font:700 17px "Barlow Condensed",sans-serif;padding:12px 4px;border-radius:10px}
.tab.on{color:var(--acc);background:var(--field)}
.timer{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;z-index:6}
.timer.on{display:flex}
.timer b{font:700 30px "Barlow Condensed",sans-serif}
.timer button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 12px}
.hist{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border:0}
svg{width:100%;height:auto;display:block}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 16px;border-radius:10px;z-index:9;display:none}
ul{padding-left:20px;margin:8px 0}
.swap{border:0;background:none;color:var(--acc);font:600 14px Barlow,sans-serif;padding:2px 0;margin:0 0 8px}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.fld label{font-size:13px;color:var(--mut)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:10px;font:500 13px/1.3 ui-monospace,monospace;margin:8px 0}
textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
li{margin:4px 0}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
</style>
</head>
<body>
<main id="app"></main>
<div class="timer" id="timer" role="timer"><span>Repos</span><b id="tv">1:30</b><button id="tx">Passer</button></div>
<div class="toast" id="toast" role="status"></div>
<nav class="tabs" aria-label="Navigation">
<button class="tab" data-tab="s">Séance</button>
<button class="tab" data-tab="w">Poids</button>
<button class="tab" data-tab="m">Mesures</button>
<button class="tab" data-tab="p">Programme</button>
</nav>
<script>
var K='suivi-basic-fit-v1',START=125,GOAL=100;
var TITLES={A:['Séance A','Jambes + pousser'],B:['Séance B','Tirer + jambes'],C:['Séance C','Corps entier'],D:['Séance D','Haut du corps'],E:['Séance E','Jambes + abdos']};
var MF=[['taille','Tour de taille'],['hanches','Hanches'],['poitrine','Poitrine'],['bras','Bras'],['cuisse','Cuisse']];
var PL=['Planche sur les genoux','Planche latérale','Gainage sur banc incliné'],PR=['Squat à la Smith machine','Hack squat','Goblet squat (haltère)'];
var ALT={presse:PR,presse2:PR,pl:PL,pl2:PL,ext:['Fentes (haltères légers)','Step-up sur banc'],pec:['Développé couché à la Smith','Développé haltères sur banc','Pompes sur banc incliné'],ep:['Développé haltères assis','Élévations latérales (haltères)'],curl:['Leg curl allongé','Soulevé de terre roumain (haltères)'],tir:['Tirage poitrine prise neutre','Pull-over à la poulie','Tractions assistées (machine)'],row:['Rowing haltère un bras','Rowing machine guidée'],hip:['Pont fessier au sol','Extension de hanche (machine)'],bic:['Curl poulie basse','Curl marteau (haltères)'],fly:['Écartés haltères','Écartés à la poulie'],tir2:['Rowing haltère un bras','Tirage vertical prise serrée'],tri:['Extension triceps (haltère)','Dips assisté (machine)'],inc:['Développé incliné haltères','Pompes sur banc incliné'],tirn:['Tirage vertical','Rowing assis (poulie)'],lat:['Oiseau haltères','Développé épaules (machine)'],face:['Oiseau à la machine','Rowing menton léger'],tri2:['Extension triceps (haltère)','Dips assisté (machine)'],smith:['Presse à cuisses','Goblet squat (haltère)'],rdl:['Leg curl assis','Pont fessier au banc'],abd:['Adducteurs (machine)','Fentes latérales'],mol:['Mollets à la presse','Mollets assis (machine)'],crunch:['Crunch machine','Relevé de jambes au banc']};
var EXTRA={D:[['inc','Développé incliné (machine)','3 × 10–12','Banc réglé à 30°.'],['tirn','Tirage poitrine prise neutre','3 × 10–12','Poitrine sortie, coudes vers le bas.'],['lat','Élévations latérales (haltères)','3 × 12–15','Poids léger, sans élan.'],['face','Face pull à la poulie','3 × 15','Coudes hauts, tirez vers le visage.'],['tri2','Extension triceps (corde)','2 × 12','Coudes fixes.']],E:[['smith','Squat à la Smith machine','3 × 10','Pieds légèrement en avant.'],['rdl','Soulevé de terre roumain (haltères)','3 × 10','Dos droit, hanches en arrière.'],['abd','Abducteurs (machine)','3 × 15','Mouvement lent.'],['mol','Mollets debout (machine)','3 × 15','Montée complète.'],['crunch','Crunch à la poulie','3 × 15','Enroulez le buste, sans tirer avec les bras.']]};
var EX={
A:[['presse','Presse à cuisses','3 × 10–12','Pieds à largeur d’épaules, descente lente.'],['ext','Leg extension','3 × 12–15','Montée contrôlée, sans claquer.'],['pec','Développé pectoraux (machine)','3 × 10–12','Dos plaqué, épaules basses.'],['ep','Développé épaules (machine)','3 × 10–12','Ne cambrez pas le dos.'],['pl','Gainage planche','3 × 20–40 s','Notez les secondes dans « reps ».',1]],
B:[['curl','Leg curl assis','3 × 12','Dos bien calé dans le siège.'],['tir','Tirage vertical','3 × 10–12','Tirez vers le haut de la poitrine.'],['row','Rowing assis (poulie)','3 × 10–12','Poitrine sortie, coudes près du corps.'],['hip','Pont fessier au banc','3 × 12','Serrez les fessiers en haut.'],['bic','Curl biceps (haltères)','2 × 12','Poids léger, sans élan.']],
C:[['presse2','Presse à cuisses','3 × 10–12','Même réglage que la séance A.'],['fly','Pec deck (butterfly)','3 × 12–15','Amplitude confortable.'],['tir2','Tirage horizontal (machine)','3 × 10–12','Serrez les omoplates.'],['tri','Triceps à la poulie','3 × 12','Coudes fixes le long du corps.'],['pl2','Gainage planche','3 × 20–40 s','Notez les secondes dans « reps ».',1]]
};
EX.D=EXTRA.D;EX.E=EXTRA.E;
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var S={w:[{d:today(),v:START}],s:[],dr:{},m:[],sw:{},tab:'s',day:null};
try{var r=localStorage.getItem(K);if(r){var o=JSON.parse(r);S.w=o.w||S.w;S.s=o.s||[];S.dr=o.dr||{};S.m=o.m||[];S.sw=o.sw||{}}}catch(e){}
function snap(){return JSON.stringify({w:S.w,s:S.s,dr:S.dr,m:S.m,sw:S.sw})}
function save(){try{localStorage.setItem(K,snap())}catch(e){}}
function fmt(n){return String(Math.round(n*10)/10).replace('.',',')}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cur(){return S.w.length?S.w[S.w.length-1].v:START}
function nextDay(){return ['A','B','C'][S.s.filter(function(x){return 'ABC'.indexOf(x.day)>=0}).length%3]}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},2200)}

function vSeance(){
 var d=S.day||(S.day=nextDay()),ex=EX[d],dr=S.dr[d]=S.dr[d]||{ex:{},c:''};
 var last=null;for(var i=S.s.length-1;i>=0;i--){if(S.s[i].day===d){last=S.s[i];break}}
 var wk=S.s.filter(function(x){return (Date.now()-new Date(x.date).getTime())<7*864e5}).length;
 var h='<h1>Séance du jour</h1><p class="sub">'+wk+' séance'+(wk>1?'s':'')+' sur les 7 derniers jours · objectif 3</p>';
 h+='<div class="chips">'+['A','B','C','D','E'].map(function(k){return '<button class="chip'+(k===d?' on':'')+'" data-day="'+k+'">'+TITLES[k][0]+'<small>'+TITLES[k][1]+'</small></button>'}).join('')+'</div>';
 ex.forEach(function(e){
  var oid=e[0],n=S.sw[oid]||0,al=ALT[oid]||[],id=n?oid+'~'+n:oid,t=e[4],nm=n?al[n-1]:e[1],tp=n?'Alternative à « '+e[1]+' ».':e[3],rows=dr.ex[id]=dr.ex[id]||[['','',0],['','',0],['','',0]];
  var lv=last&&last.ex[id]||[];
  h+='<section class="card exo"><h3>'+nm+'</h3><p>'+e[2]+' · '+tp+'</p>'+(al.length?'<button class="swap" data-sw="'+oid+'">Remplacer l’exercice ↻</button>':'')+'<div class="cols"><span></span><span>'+(t?'—':'kg')+'</span><span>'+(t?'secondes':'reps')+'</span><span></span></div>';
  rows.forEach(function(s,i){
   var l=lv[i]||[];
   h+='<div class="set"><span>'+(i+1)+'</span><input inputmode="decimal" '+(t?'disabled':'')+' data-k="'+id+'|'+i+'|0" value="'+esc(s[0])+'" placeholder="'+esc(l[0]||'')+'" aria-label="Poids série '+(i+1)+'"><input inputmode="decimal" data-k="'+id+'|'+i+'|1" value="'+esc(s[1])+'" placeholder="'+esc(l[1]||'')+'" aria-label="Répétitions série '+(i+1)+'"><button class="chk'+(s[2]?' on':'')+'" data-chk="'+id+'|'+i+'" aria-label="Valider la série '+(i+1)+'">'+(s[2]?'✓':'')+'</button></div>';
  });
  h+='</section>';
 });
 h+='<section class="card"><h3>Cardio (fin de séance)</h3><p class="sub">Marche inclinée ou vélo, effort tranquille.</p><div class="set" style="grid-template-columns:1fr 60px;margin-top:10px"><input inputmode="numeric" data-c="1" value="'+esc(dr.c)+'" placeholder="Minutes" aria-label="Minutes de cardio"><span>min</span></div></section>';
 h+='<button class="btn" id="fin">Terminer la séance</button>';
 return h;
}

function chart(){
 var w=S.w;if(w.length<2)return '<p class="sub">Ajoutez au moins deux pesées pour voir la courbe.</p>';
 var W=320,H=170,pl=34,pr=8,pt=10,pb=22,lo=GOAL-3,hi=Math.max(START,Math.max.apply(null,w.map(function(x){return x.v})))+2;
 var t0=new Date(w[0].d).getTime(),t1=new Date(w[w.length-1].d).getTime();if(t1===t0)t1=t0+864e5;
 var X=function(d){return pl+(new Date(d).getTime()-t0)/(t1-t0)*(W-pl-pr)};
 var Y=function(v){return pt+(hi-v)/(hi-lo)*(H-pt-pb)};
 var pts=w.map(function(x){return X(x.d).toFixed(1)+','+Y(x.v).toFixed(1)}).join(' ');
 var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Courbe de poids"><g stroke="var(--line)" stroke-width="1">';
 [GOAL,Math.round((GOAL+hi)/2),Math.round(hi)].forEach(function(v){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/>'});
 g+='</g><g fill="var(--mut)" font-size="10" font-family="Barlow,sans-serif">';
 [GOAL,Math.round((GOAL+hi)/2),Math.round(hi)].forEach(function(v){g+='<text x="2" y="'+(Y(v)+3)+'">'+v+'</text>'});
 g+='</g><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(GOAL)+'" y2="'+Y(GOAL)+'" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 4"/>';
 g+='<polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
 w.forEach(function(x){g+='<circle cx="'+X(x.d)+'" cy="'+Y(x.v)+'" r="3.5" fill="var(--acc)"/>'});
 return g+'</svg>';
}

function vPoids(){
 var c=cur(),lost=START-c,left=Math.max(0,c-GOAL),pct=Math.max(0,Math.min(100,lost/(START-GOAL)*100));
 var h='<h1>Poids</h1><p class="sub">De '+START+' kg à '+GOAL+' kg</p>';
 h+='<section class="card"><div class="hero"><div class="big">'+fmt(c)+'<small>kg</small></div><div class="sub">objectif '+GOAL+' kg</div></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
 h+='<div class="stats"><div><b>'+fmt(Math.max(0,lost))+'</b><span>kg perdus</span></div><div><b>'+fmt(left)+'</b><span>kg restants</span></div><div><b>'+Math.round(pct)+' %</b><span>du chemin</span></div></div></section>';
 h+='<section class="card"><h3>Nouvelle pesée</h3><div class="row" style="margin-top:10px"><input id="wv" inputmode="decimal" placeholder="Ex. 123,4" aria-label="Poids en kg"><button class="btn" id="wadd" style="width:auto;padding:12px 18px">Enregistrer</button></div><p class="sub" style="font-size:14px">Pesez-vous le même jour, à la même heure, par exemple le lundi matin à jeun.</p></section>';
 h+='<section class="card">'+chart()+'</section>';
 h+='<section class="card"><h3>Historique</h3>'+S.w.slice().reverse().slice(0,12).map(function(x){var ri=S.w.indexOf(x);return '<div class="hist"><span>'+new Date(x.d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})+'</span><span><b>'+fmt(x.v)+' kg</b><button class="ghost" data-del="'+ri+'" aria-label="Supprimer cette pesée">×</button></span></div>'}).join('')+'</section>';
 h+='<p class="sub">Un rythme de 0,5 à 1 kg par semaine est réaliste et durable : comptez 6 à 12 mois pour perdre 25 kg.</p>';
 return h;
}

function vMes(){
 var m=S.m,l=m[m.length-1],h='<h1>Mensurations</h1><p class="sub">La balance ne dit pas tout : le tour de taille baisse souvent avant le poids.</p>';
 h+='<section class="card"><h3>Nouvelles mesures (cm)</h3><div class="fld">'+MF.map(function(x){return '<div><label for="m_'+x[0]+'">'+x[1]+'</label><input id="m_'+x[0]+'" inputmode="decimal" placeholder="'+(l&&l[x[0]]?fmt(l[x[0]]):'cm')+'"></div>'}).join('')+'</div><button class="btn" id="madd">Enregistrer</button><p class="sub" style="font-size:14px">Mesurez toujours au même endroit, une fois par mois, avec un mètre ruban souple.</p></section>';
 if(m.length){
  h+='<section class="card"><h3>Évolution</h3>'+MF.map(function(x){var k=x[0],a=null,b=null;m.forEach(function(e){if(e[k]){if(a===null)a=e[k];b=e[k]}});if(a===null)return '';var dl=b-a;return '<div class="hist"><span>'+x[1]+'</span><span><b>'+fmt(b)+' cm</b> <span class="sub">('+(dl>0?'+':'')+fmt(dl)+' depuis le début)</span></span></div>'}).join('')+'</section>';
  h+='<section class="card"><h3>Historique</h3>'+m.slice().reverse().slice(0,10).map(function(e){var ri=m.indexOf(e);return '<div class="hist"><span>'+new Date(e.d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})+'</span><span class="sub">'+MF.filter(function(x){return e[x[0]]}).map(function(x){return x[1].split(' ').pop()+' '+fmt(e[x[0]])}).join(', ')+'<button class="ghost" data-mdel="'+ri+'" aria-label="Supprimer ces mesures">×</button></span></div>'}).join('')+'</section>';
 }
 return h;
}
function vBackup(){
 return '<section class="card"><h3>Sauvegarde</h3><p class="sub">Vos données restent sur ce téléphone. Envoyez-vous la sauvegarde (WhatsApp, e-mail, notes) pour ne rien perdre ou pour changer de téléphone.</p><div class="row" style="margin:10px 0"><button class="btn alt" id="bcopy">Copier</button>'+(navigator.share?'<button class="btn" id="bshare">Envoyer</button>':'')+'</div><textarea id="bdata" aria-label="Texte de sauvegarde" placeholder="Collez ici une sauvegarde à restaurer"></textarea><button class="btn alt" id="brest">Restaurer depuis ce texte</button><p class="sub" style="font-size:14px">La restauration remplace les données actuelles.</p></section>';
}
function vProg(){
 return '<h1>Programme</h1><p class="sub">Débutant, 3 séances par semaine à Basic-Fit</p>'+
 '<section class="card"><h3>Semaine type</h3><ul><li><b>Lundi</b> : séance A</li><li><b>Mardi</b> : marche rapide 30 à 45 min</li><li><b>Mercredi</b> : séance B</li><li><b>Jeudi</b> : marche rapide ou repos</li><li><b>Vendredi</b> : séance C</li><li><b>Week-end</b> : activité douce (marche, vélo) et repos</li><li><b>Séances D et E</b> : facultatives, à faire à la place d’une marche quand vous êtes en forme</li></ul></section>'+
 '<section class="card"><h3>Progression</h3><ul><li>Choisissez une charge qui laisse 2 répétitions « en réserve » sur la dernière série.</li><li>Quand vous atteignez le haut de la fourchette sur toutes les séries, ajoutez le plus petit incrément de la machine à la séance suivante.</li><li>Les 3 premières semaines : apprenez les mouvements avec des charges légères.</li><li>Repos entre les séries : 60 à 90 secondes.</li></ul></section>'+
 '<section class="card"><h3>Pour tenir sur la durée</h3><ul><li>Machines guidées d’abord : elles ménagent le dos et les genoux.</li><li>Échauffement : 5 à 8 minutes de vélo ou de marche.</li><li>Dormez 7 à 8 heures et buvez de l’eau pendant la séance.</li><li>La perte de poids se joue surtout à l’assiette : un déficit modéré et régulier, sans régime extrême.</li><li>Avant de démarrer, un avis médical est conseillé, surtout à ce poids de départ.</li></ul></section>'+vBackup();
}

function render(){
 var a=document.getElementById('app');
 a.innerHTML=S.tab==='s'?vSeance():S.tab==='w'?vPoids():S.tab==='m'?vMes():vProg();
 document.querySelectorAll('.tab').forEach(function(t){var on=t.dataset.tab===S.tab;t.classList.toggle('on',on);if(on)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
}

var tm=null,left=0;
function tick(){left--;var e=document.getElementById('tv');e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left<=0){stopT();if(navigator.vibrate)navigator.vibrate(300)}}
function startT(){stopT();left=90;document.getElementById('tv').textContent='1:30';document.getElementById('timer').classList.add('on');tm=setInterval(tick,1000)}
function stopT(){clearInterval(tm);document.getElementById('timer').classList.remove('on')}
document.getElementById('tx').onclick=stopT;

document.addEventListener('click',function(e){
 var t=e.target.closest('[data-tab],[data-day],[data-chk],[data-del],[data-sw],[data-mdel],#fin,#wadd,#madd,#bcopy,#bshare,#brest');if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
 if(t.dataset.day){S.day=t.dataset.day;render();return}
 if(t.dataset.sw){var o2=t.dataset.sw,m2=(ALT[o2]||[]).length+1;S.sw[o2]=((S.sw[o2]||0)+1)%m2;save();render();return}
 if(t.dataset.mdel){S.m.splice(+t.dataset.mdel,1);save();render();return}
 if(t.id==='madd'){var en={d:today()},any=false;MF.forEach(function(f){var v=num(document.getElementById('m_'+f[0]).value);if(v&&v>5&&v<300){en[f[0]]=v;any=true}});if(!any){toast('Entrez au moins une mesure');return}var j=S.m.findIndex(function(x){return x.d===en.d});if(j>=0){S.m[j]=Object.assign(S.m[j],en)}else{S.m.push(en)}save();render();toast('Mesures enregistrées');return}
 if(t.id==='bcopy'){var ta=document.getElementById('bdata');ta.value=snap();ta.select();try{document.execCommand('copy')}catch(x){}try{if(navigator.clipboard)navigator.clipboard.writeText(ta.value)}catch(x){}toast('Sauvegarde copiée');return}
 if(t.id==='bshare'){if(navigator.share){navigator.share({title:'Sauvegarde suivi Basic-Fit',text:snap()}).catch(function(){})}else{toast('Partage indisponible : utilisez Copier')}return}
 if(t.id==='brest'){try{var o3=JSON.parse(document.getElementById('bdata').value);if(!Array.isArray(o3.w)||!Array.isArray(o3.s))throw 0;S.w=o3.w;S.s=o3.s;S.dr=o3.dr||{};S.m=o3.m||[];S.sw=o3.sw||{};S.day=null;save();render();toast('Données restaurées')}catch(x){toast('Texte de sauvegarde invalide')}return}
 if(t.dataset.chk){var p=t.dataset.chk.split('|'),row=S.dr[S.day].ex[p[0]][+p[1]];row[2]=row[2]?0:1;save();render();if(row[2])startT();return}
 if(t.dataset.del){S.w.splice(+t.dataset.del,1);save();render();return}
 if(t.id==='wadd'){var v=num(document.getElementById('wv').value);if(!v||v<30||v>400){toast('Entrez un poids valide');return}
  var d=today(),i=S.w.findIndex(function(x){return x.d===d});if(i>=0)S.w[i].v=v;else S.w.push({d:d,v:v});S.w.sort(function(a,b){return a.d<b.d?-1:1});save();render();toast('Pesée enregistrée');return}
 if(t.id==='fin'){var dr=S.dr[S.day],n=0;Object.keys(dr.ex).forEach(function(k){dr.ex[k].forEach(function(s){if(s[2])n++})});
  if(!n){toast('Validez au moins une série');return}
  S.s.push({date:today(),day:S.day,ex:dr.ex,c:dr.c});delete S.dr[S.day];S.day=null;save();stopT();render();toast('Séance enregistrée');window.scrollTo(0,0)}
});
document.addEventListener('input',function(e){
 var k=e.target.dataset;if(k.k){var p=k.k.split('|');S.dr[S.day].ex[p[0]][+p[1]][+p[2]]=e.target.value;save()}
 else if(k.c){S.dr[S.day].c=e.target.value;save()}
});
render();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
