 h+='<section class="card"><label class="sub" for="hsel">Exercice</label><select id="hsel">'+names.map(function(n){return '<option value="'+esc(n)+'"'+(n===sel?' selected':'')+'>'+esc(n)+' ('+H[n].length+')</option>'}).join('')+'</select>';
 h+='<div class="stats sm"><div><b>'+(T?best.rp+' s':fmt(best.kg)+' kg × '+best.rp)+'</b><span>meilleure série</span></div><div><b>'+E.length+'</b><span>séance'+(E.length>1?'s':'')+'</span></div><div><b>'+(T?rt+' s':Math.round(vv).toLocaleString('fr-FR')+' kg')+'</b><span>'+(T?'temps total':'volume total')+'</span></div></div></section>';
 h+='<section class="card"><h3>Progression</h3><p class="sub" style="font-size:14px;margin:2px 0 6px">'+(T?'Meilleure durée par séance (s)':'Charge maximale par séance (kg)')+'</p>'+lchart(pts)+'</section>';
 h+='<section class="card"><h3>Séances</h3>'+E.slice().reverse().slice(0,15).map(function(e){return '<div class="hist" style="align-items:flex-start"><span><b>'+sdate(e.d)+'</b><br><span class="sub" style="font-size:13px">'+TITLES[e.day][0]+'</span></span><span style="text-align:right">'+e.sets.map(function(s){return T?s.rp+' s':(s.kg?fmt(s.kg)+' kg × ':'')+s.rp}).join('<br>')+'</span></div>'}).join('')+'</section>';
 return h;
}
function vMes(){
 var m=S.m,l=m[m.length-1],h='<h1>Mensurations</h1><p class="sub">La balance ne dit pas tout : le tour de taille baisse souvent avant le poids.</p>';
 h+='<section class="card"><h3>Nouvelles mesures (cm)</h3><div class="fld">'+MF.map(function(x){return '<div><label for="m_'+x[0]+'">'+x[1]+'</label><input id="m_'+x[0]+'" inputmode="decimal" placeholder="'+(l&&l[x[0]]?fmt(l[x[0]]):'cm')+'"></div>'}).join('')+'</div><button class="btn" id="madd">Enregistrer</button><p class="sub" style="font-size:14px">Mesurez toujours au même endroit, une fois par mois, avec un mètre ruban souple.</p></section>';
 if(m.length){
  h+='<section class="card"><h3>Évolution</h3>'+MF.map(function(x){var k=x[0],a=null,b=null;m.forEach(function(e){if(e[k]){if(a===null)a=e[k];b=e[k]}});if(a===null)return '';var dl=b-a;return '<div class="hist"><span>'+x[1]+'</span><span><b>'+fmt(b)+' cm</b> <span class="sub">('+(dl>0?'+':'')+fmt(dl)+' depuis le début)</span></span></div>'}).join('')+'</section>';
  h+='<section class="card"><h3>Historique</h3>'+m.slice().reverse().slice(0,10).map(function(e){var ri=m.indexOf(e);return '<div class="hist"><span>'+new Date(e.d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})+'</span><span class="sub">'+MF.filter(function(x){return e[x[0]]}).map(function(x){return x[1].split(' ').pop()+' '+fmt(e[x[0]])}).join(', ')+'<button class="ghost" data-mdel="'+ri+'" aria-label="Supprimer ces mesures">×</button></span></div>'}).join('')+'</section>';
 }
 return h;
}
function vGh(){
 var e=esc;
 return '<section class="card"><h3>Synchronisation GitHub</h3><p class="sub">Envoie la sauvegarde dans un fichier de votre dépôt GitHub. Choisissez un dépôt <b>privé</b> : vos poids et vos mesures sont des données personnelles.</p>'+
 '<div class="fld" style="grid-template-columns:1fr"><div><label for="gh_repo">Dépôt (pseudo/nom)</label><input id="gh_repo" value="'+e(GH.repo)+'" placeholder="pseudo/suivi-basic-fit-data" autocapitalize="none" autocomplete="off"></div>'+
 '<div><label for="gh_path">Fichier dans le dépôt</label><input id="gh_path" value="'+e(GH.path)+'" autocapitalize="none" autocomplete="off"></div>'+
 '<div><label for="gh_tok">Jeton d’accès GitHub</label><input id="gh_tok" type="password" value="'+e(GH.tok)+'" placeholder="github_pat_…" autocomplete="off"></div></div>'+
 '<label class="row" style="margin:6px 0"><input type="checkbox" id="gh_auto" style="width:auto"'+(GH.auto?' checked':'')+'> Envoyer automatiquement après chaque modification</label>'+
 '<button class="btn alt" id="ghsave" style="margin:6px 0">Enregistrer les réglages</button><div class="row" style="margin:6px 0"><button class="btn" id="ghpush">Envoyer</button><button class="btn alt" id="ghpull">Récupérer</button></div>'+
 '<p class="sub" id="ghs" role="status" style="font-size:14px">'+e(ghMsg||(GH.last?'Dernière synchronisation : '+GH.last:''))+'</p>'+
 '<details class="tt"><summary>Comment obtenir le jeton ?</summary><div class="in"><ol><li>GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li><li>Repository access : <b>Only select repositories</b>, puis votre dépôt privé de sauvegarde.</li><li>Permissions → Repository permissions → <b>Contents : Read and write</b>.</li><li>Collez le jeton ici. Il reste sur ce téléphone et n’est jamais inclus dans la sauvegarde.</li></ol></div></details></section>';
}
function vBackup(){
 return '<section class="card"><h3>Sauvegarde</h3><p class="sub">Vos données restent sur ce téléphone. Envoyez-vous la sauvegarde (WhatsApp, e-mail, notes) pour ne rien perdre ou pour changer de téléphone.</p><div class="row" style="margin:10px 0"><button class="btn alt" id="bcopy">Copier</button>'+(navigator.share?'<button class="btn" id="bshare">Envoyer</button>':'')+'</div><textarea id="bdata" aria-label="Texte de sauvegarde" placeholder="Collez ici une sauvegarde à restaurer"></textarea><button class="btn alt" id="brest">Restaurer depuis ce texte</button><p class="sub" style="font-size:14px">La restauration remplace les données actuelles.</p></section>'+vGh();
}
function vProg(){
 return '<h1>Programme</h1><p class="sub">Débutant, 3 séances par semaine à Basic-Fit</p>'+vPlan()+
 '<section class="card"><h3>Semaine type</h3><ul><li><b>Lundi</b> : séance A</li><li><b>Mardi</b> : marche rapide 30 à 45 min</li><li><b>Mercredi</b> : séance B</li><li><b>Jeudi</b> : marche rapide ou repos</li><li><b>Vendredi</b> : séance C</li><li><b>Week-end</b> : activité douce (marche, vélo) et repos</li><li><b>Séances D et E</b> : facultatives, à faire à la place d’une marche quand vous êtes en forme</li></ul></section>'+
 '<section class="card"><h3>Progression</h3><ul><li>Choisissez une charge qui laisse 2 répétitions « en réserve » sur la dernière série.</li><li>Quand vous atteignez le haut de la fourchette sur toutes les séries, ajoutez le plus petit incrément de la machine à la séance suivante.</li><li>Les 3 premières semaines : apprenez les mouvements avec des charges légères.</li><li>Repos entre les séries : 60 à 90 secondes.</li></ul></section>'+
 '<section class="card"><h3>Pour tenir sur la durée</h3><ul><li>Machines guidées d’abord : elles ménagent le dos et les genoux.</li><li>Échauffement : 5 à 8 minutes de vélo ou de marche.</li><li>Dormez 7 à 8 heures et buvez de l’eau pendant la séance.</li><li>La perte de poids se joue surtout à l’assiette : un déficit modéré et régulier, sans régime extrême.</li><li>Avant de démarrer, un avis médical est conseillé, surtout à ce poids de départ.</li></ul></section>'+vBackup();
}

function render(){
 var a=document.getElementById('app');
 a.innerHTML=S.tab==='s'?vSeance():S.tab==='w'?vPoids():S.tab==='m'?vMes():S.tab==='h'?vHist():vProg();
 document.querySelectorAll('.tab').forEach(function(t){var on=t.dataset.tab===S.tab;t.classList.toggle('on',on);if(on)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
}

var tm=null,left=0;
function tick(){left--;var e=document.getElementById('tv');e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left<=0){stopT();if(navigator.vibrate)navigator.vibrate(300)}}
function startT(){stopT();left=90;document.getElementById('tv').textContent='1:30';document.getElementById('timer').classList.add('on');tm=setInterval(tick,1000)}
function stopT(){clearInterval(tm);document.getElementById('timer').classList.remove('on')}
document.getElementById('tx').onclick=stopT;

document.addEventListener('click',function(e){
 var t=e.target.closest('[data-tab],[data-day],[data-chk],[data-del],[data-sw],[data-mdel],#fin,#wadd,#madd,#bcopy,#bshare,#brest,#ghsave,#ghpush,#ghpull,[data-go],[data-per],#plgen,#plnew,#plcancel,#demo,#demoOff');if(!t)return;
 if(t.dataset.tab){DEMO=false;S.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
 if(t.dataset.day){S.day=t.dataset.day;render();return}
 if(t.dataset.go){S.tab='s';S.day=t.dataset.go;render();window.scrollTo(0,0);return}
 if(t.dataset.per){var d2=document.getElementById('pl_start');if(d2&&d2.value)PF.start=d2.value;PF.per=+t.dataset.per;render();return}
 if(t.id==='plgen'){var ds=document.getElementById('pl_start').value;if(!ds){toast('Choisissez une date de départ');return}PF.start=ds;S.p=genPlan(ds,PF.per);PLEDIT=false;save();render();toast('Programme créé');return}
 if(t.id==='plnew'){PLEDIT=true;render();return}
 if(t.id==='plcancel'){PLEDIT=false;render();return}
 if(t.id==='demo'){DEMO=true;render();return}
 if(t.id==='demoOff'){DEMO=false;render();return}
 if(t.id==='ghsave'){GH.repo=document.getElementById('gh_repo').value.trim();GH.path=document.getElementById('gh_path').value.trim()||GH.path;GH.tok=document.getElementById('gh_tok').value.trim();GH.auto=document.getElementById('gh_auto').checked;ghSave();toast('Réglages enregistrés');return}
 if(t.id==='ghpush'||t.id==='ghpull'){var pull=t.id==='ghpull';ghMsg='En cours…';paintGh();(pull?(ghSkip=true,ghPull()):ghPush()).then(function(){ghSkip=false;ghMsg=pull?'Données récupérées depuis GitHub.':'Envoyé le '+GH.last;if(pull)render();else paintGh();toast(pull?'Données récupérées':'Sauvegarde envoyée')}).catch(function(e){ghSkip=false;ghMsg='Échec : '+e.message;paintGh()});return}
 if(t.dataset.sw){var o2=t.dataset.sw,m2=(ALT[o2]||[]).length+1;S.sw[o2]=((S.sw[o2]||0)+1)%m2;save();render();return}
 if(t.dataset.mdel){S.m.splice(+t.dataset.mdel,1);save();render();return}
 if(t.id==='madd'){var en={d:today()},any=false;MF.forEach(function(f){var v=num(document.getElementById('m_'+f[0]).value);if(v&&v>5&&v<300){en[f[0]]=v;any=true}});if(!any){toast('Entrez au moins une mesure');return}var j=S.m.findIndex(function(x){return x.d===en.d});if(j>=0){S.m[j]=Object.assign(S.m[j],en)}else{S.m.push(en)}save();render();toast('Mesures enregistrées');return}
 if(t.id==='bcopy'){var ta=document.getElementById('bdata');ta.value=snap();ta.select();try{document.execCommand('copy')}catch(x){}try{if(navigator.clipboard)navigator.clipboard.writeText(ta.value)}catch(x){}toast('Sauvegarde copiée');return}
 if(t.id==='bshare'){if(navigator.share){navigator.share({title:'Sauvegarde suivi Basic-Fit',text:snap()}).catch(function(){})}else{toast('Partage indisponible : utilisez Copier')}return}
 if(t.id==='brest'){try{var o3=JSON.parse(document.getElementById('bdata').value);if(!Array.isArray(o3.w)||!Array.isArray(o3.s))throw 0;S.w=o3.w;S.s=o3.s;S.dr=o3.dr||{};S.m=o3.m||[];S.sw=o3.sw||{};S.p=o3.p||null;S.day=null;save();render();toast('Données restaurées')}catch(x){toast('Texte de sauvegarde invalide')}return}
 if(t.dataset.chk){var p=t.dataset.chk.split('|'),row=S.dr[S.day].ex[p[0]][+p[1]];row[2]=row[2]?0:1;save();render();if(row[2])startT();return}
 if(t.dataset.del){S.w.splice(+t.dataset.del,1);save();render();return}
 if(t.id==='wadd'){var v=num(document.getElementById('wv').value);if(!v||v<30||v>400){toast('Entrez un poids valide');return}
  var d=today(),i=S.w.findIndex(function(x){return x.d===d});if(i>=0)S.w[i].v=v;else S.w.push({d:d,v:v});S.w.sort(function(a,b){return a.d<b.d?-1:1});save();render();toast('Pesée enregistrée');return}
 if(t.id==='fin'){var dr=S.dr[S.day],n=0;Object.keys(dr.ex).forEach(function(k){dr.ex[k].forEach(function(s){if(s[2])n++})});
  if(!n){toast('Validez au moins une série');return}
  S.s.push({date:today(),day:S.day,ex:dr.ex,c:dr.c});delete S.dr[S.day];S.day=null;save();stopT();render();toast('Séance enregistrée');window.scrollTo(0,0)}
});
document.addEventListener('change',function(e){if(e.target.id==='hsel'){HSEL=e.target.value;render()}});
document.addEventListener('toggle',function(e){var d=e.target;if(d&&d.dataset&&d.dataset.o)OPEN[d.dataset.o]=d.open},true);
document.addEventListener('input',function(e){
 var k=e.target.dataset;if(k.k){var p=k.k.split('|');S.dr[S.day].ex[p[0]][+p[1]][+p[2]]=e.target.value;save()}
 else if(k.c){S.dr[S.day].c=e.target.value;save()}
});
render();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
